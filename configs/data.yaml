# Configuration for the Step 1 dataset (UCI Diabetes 130-US Hospitals).
# Keeping settings in config (not hard-coded) makes the pipeline reusable.

dataset:
  name: diabetes_130_us
  uci_id: 296                 # UCI ML Repository id for "Diabetes 130-US Hospitals"

target:
  source_column: readmitted   # original values: '<30', '>30', 'NO'
  positive_value: "<30"       # we predict readmission WITHIN 30 days
  binary_column: readmitted_30d

cleaning:
  missing_token: "?"          # this dataset encodes missing values as '?'
  drop_columns:               # columns dropped up front (too sparse / not useful)
    - weight                  # ~97% missing
    - payer_code
    - medical_specialty

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  processed_file: data/processed/diabetes.parquet

# Configuration for Step 5 — hyperparameter tuning.

cv_folds: 5
n_iter: 30                    # number of randomized search combinations to try
scoring: f1

search_space:
  n_estimators: [100, 200, 300, 500]
  max_depth: [3, 4, 5, 6]
  learning_rate: [0.01, 0.03, 0.05, 0.1]
  subsample: [0.7, 0.8, 0.9, 1.0]
  colsample_bytree: [0.7, 0.8, 0.9, 1.0]
  min_child_weight: [1, 3, 5]

paths:
  best_params_file: reports/best_params.json
  tuning_metrics_file: reports/tuning_metrics.json
